name: Self-hosted CI/CD

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Validate application syntax
        run: python3 -m py_compile app.py

      - name: Build Docker image
        run: docker build -t data-ia-projet:latest .

  deploy:
    needs: build-and-test
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t data-ia-projet:latest .

      - name: Stop previous container
        run: |
          docker rm -f data-ia-projet >/dev/null 2>&1 || true

      - name: Run application container
        run: |
          docker run -d --name data-ia-projet --restart unless-stopped -p 8501:8501 data-ia-projet:latest